<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quando faltam palavras</title>
    <style>
        /* Reseta margens e trava a rolagem da página */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden; /* Garante zero barras de rolagem */
            background-color: #0b0d12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container centralizado */
        .main-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* Título do Jogo (Sempre em minúsculas) */
        h1 {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 1px;
            color: #d1d5db;
            margin-bottom: 2.5rem;
            text-transform: lowercase; /* Força o texto em minúsculo */
            opacity: 0.9;
        }

        /* Botão de Ação */
        .play-button {
            display: inline-block;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 400;
            color: #ffffff;
            background-color: #238636;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.25);
            text-transform: lowercase; /* Texto do botão também em minúsculo */
        }

        .play-button:hover {
            background-color: #2ea043;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(46, 160, 67, 0.35);
        }

        .play-button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>quando faltam palavras</h1>
        <a href="#" class="play-button">viva a experiência</a>
    </div>

    <!-- Script do Webhook do Discord -->

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({
                    content: "✨ **Alguém acabou de acessar a página da homenagem!**"
                })
            })
            .then(() => console.log("Aviso enviado ao Discord com sucesso!"))
            .catch(err => console.error("Erro ao notificar Discord:", err));
        });
    </script>
</body>
</html>
