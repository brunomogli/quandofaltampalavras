<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>quando faltam palavras</title>

    <!-- Fonte ultra legível para mobile -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
            background-color: #030712; /* Fundo bem escuro para contrastar com o card */
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Card com fundo bem visível e borda contrastante */
        .main-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 36px 24px;
            max-width: 440px;
            width: 90%;
            background-color: #111827; /* Cinza-azulado fechado porém bem visível */
            border: 1px solid #374151;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
        }

        /* Título em BRANCO PURO e Negrito */
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff !important; /* Destaque máximo */
            margin-bottom: 16px;
            text-transform: lowercase;
            line-height: 1.2;
        }

        /* Subtítulo Nítido */
        .subtitle {
            font-size: 1.05rem;
            font-weight: 400;
            color: #e5e7eb !important; /* Cinza quase branco super legível */
            margin-bottom: 24px;
            line-height: 1.6;
            text-transform: lowercase;
        }

        /* Tag Fone de Ouvido com fundo aceso */
        .headphone-tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #1e293b;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 28px;
            width: 100%;
        }

        /* Botão VIVA A EXPERIÊNCIA com alto impacto visual */
        .play-button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 18px 24px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff !important;
            background-color: #16a34a; /* Verde vivo */
            border: 2px solid #22c55e;
            border-radius: 40px;
            cursor: pointer;
            text-decoration: none;
            text-transform: lowercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(22, 163, 74, 0.5);
            width: 100%;
        }

        .play-button:active {
            transform: scale(0.97);
            background-color: #15803d;
        }

        /* Ajustes específicos para telas menores */
        @media (max-width: 480px) {
            .main-card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.9rem;
            }

            .subtitle {
                font-size: 0.98rem;
            }

            .headphone-tag {
                font-size: 0.85rem;
            }

            .play-button {
                font-size: 1rem;
                padding: 16px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>quando faltam palavras</h1>
        
        <p class="subtitle">
            tem conexões que não aceitam fins comuns.<br>
            descubra o que não dá para descrever.
        </p>

        <div class="headphone-tag">
            🎧 recomendável usar fones de ouvido
        </div>

        <a href="#" class="play-button">viva a experiência</a>
    </div>

    <!-- Script do Webhook do Discord -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const webhookUrl = "https://discord.com/api/webhooks/1531715613624635462/WkNwDsvnYxJp8JCZDH9kaRubekOxQqBY7Z8l6CxCCJY4dBS0DOTduYiUPYToBnsBdOkr";

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({
                    content: "✨ **Alguém acabou de acessar a página da homenagem!**"
                })
            })
            .then(() => console.log("Aviso enviado ao Discord com sucesso!"))
            .catch(err => console.error("Erro ao notificar Discord:", err));
        });
    </script>
</body>
</html>
