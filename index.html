<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quando Faltam Palavras</title>
    <style>
        /* Estilos básicos para centralizar o jogo/página na tela */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #canvasContainer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div id="canvasContainer">
        <!-- O Canvas do GDevelop será inserido aqui automaticamente -->
    </div>

    <!-- Scripts do GDevelop (Gerados na exportação) -->
    <script src="gd.js" crossorigin="anonymous"></script>
    <script src="pixi.js" crossorigin="anonymous"></script>
    <script src="code0.js" crossorigin="anonymous"></script>

    <!-- Script de Notificação de Acesso (Discord Webhook da Landing Page) -->
    <script>
        (function registrarAcesso() {
            // URL do seu Webhook de acesso à página
            const webhookUrl = "https://discord.com/api/webhooks/1531715613624635462/WkNwDsvnYxJp8JCZDH9kaRubekOxQqBY7Z8l6CxCCJY4dBS0DOTduYiUPYToBnsBdOkr";

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({
                    content: "✨ **Alguém acabou de acessar a página da homenagem!**"
                })
            })
            .then(response => {
                if (response.ok) {
                    console.log("Notificação enviada ao Discord com sucesso!");
                } else {
                    console.error("Erro ao enviar notificação ao Discord:", response.statusText);
                }
            })
            .catch(error => {
                console.error("Erro na requisição da landing page:", error);
            });
        })();
    </script>
</body>
</html>
