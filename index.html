<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quando faltam palavras</title>

    <!-- Importando fontes cinematográficas do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

    <style>
        /* Reset total e trava rígida de rolagem */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden; /* Trava zero rolagem */
            background-color: #05070a;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Luzes de fundo ambiente (Efeito Nebulosa / Sonho) */
        .bg-glow-1 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(46, 160, 67, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 20%;
            left: 30%;
            filter: blur(80px);
            pointer-events: none;
            animation: floatGlow 10s infinite alternate ease-in-out;
        }

        .bg-glow-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(88, 166, 255, 0.12) 0%, rgba(0,0,0,0) 70%);
            bottom: 15%;
            right: 25%;
            filter: blur(90px);
            pointer-events: none;
            animation: floatGlow 14s infinite alternate-reverse ease-in-out;
        }

        /* Container Principal em Efeito Vidro (Glassmorphism) */
        .main-card {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 50px 35px;
            max-width: 620px;
            width: 88%;
            background: rgba(15, 20, 30, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Título do Jogo em Tipografia Editorial Clássica */
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.4rem;
            font-weight: 300;
            letter-spacing: 3px;
            background: linear-gradient(180deg, #ffffff 0%, #adbac7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 22px;
            text-transform: lowercase;
            line-height: 1.1;
            filter: drop-shadow(0 2px 10px rgba(255, 255, 255, 0.1));
        }

        /* Subtítulo Instigante */
        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.35rem;
            font-weight: 300;
            font-style: italic;
            color: #919eab;
            margin-bottom: 35px;
            line-height: 1.6;
            text-transform: lowercase;
            max-width: 480px;
        }

        /* Badge fofinha do fone de ouvido */
        .headphone-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(88, 166, 255, 0.08);
            border: 1px solid rgba(88, 166, 255, 0.2);
            color: #79c0ff;
            padding: 6px 16px;
            border-radius: 20px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.85rem;
            font-style: normal;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        /* O Botão "viva a experiência" (Ultra Glamouroso) */
        .play-button {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 18px 48px;
            font-size: 1.05rem;
            font-weight: 500;
            color: #ffffff;
            background: linear-gradient(135deg, #1f6feb 0%, #2ea043 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            text-transform: lowercase;
            letter-spacing: 2px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 25px rgba(46, 160, 67, 0.35),
                        0 10px 20px rgba(0, 0, 0, 0.4);
            margin-top: 10px;
        }

        /* Efeito Shimmer (Luz passando sobre o botão) */
        .play-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            transition: 0.5s;
            animation: shimmer 3.5s infinite;
        }

        .play-button:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 40px rgba(46, 160, 67, 0.65),
                        0 15px 30px rgba(0, 0, 0, 0.5);
            background: linear-gradient(135deg, #238636 0%, #3fb950 100%);
        }

        .play-button:active {
            transform: translateY(-1px) scale(0.99);
        }

        /* Animações Keyframes */
        @keyframes shimmer {
            0% { left: -100%; }
            30% { left: 150%; }
            100% { left: 150%; }
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 40px); }
        }

        /* Ajuste para telas pequenas/celulares */
        @media (max-width: 480px) {
            h1 { font-size: 2.6rem; }
            .subtitle { font-size: 1.15rem; }
            .play-button { padding: 16px 36px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <!-- Luzes de iluminação de fundo -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <!-- Cartão Central com Efeito de Vidro -->
    <div class="main-card">
        <h1>quando faltam palavras</h1>
        
        <p class="subtitle">
            tem conexões que não aceitam fins comuns.<br>
            descubra o que não dá para descrever.
        </p>

        <div class="headphone-tag">
            🎧 recomendável usar fones de ouvido
        </div>

        <div style="height: 30px;"></div>

        <a href="#" class="play-button">viva a experiência</a>
    </div>

            fetch(webhookUrl, {
                method: 'POST',

                },

                })
            })

            .catch(err => console.error("Erro ao notificar Discord:", err));
        });
    </script>
</body>
</html>
