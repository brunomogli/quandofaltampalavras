<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quando faltam palavras</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden; /* Zero rolagem */
            background: radial-gradient(circle at center, #121824 0%, #05070a 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            max-width: 650px;
            width: 90%;
        }

        /* Título marcante e delicado em minúsculas */
        h1 {
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #f0f6fc;
            margin-bottom: 20px;
            text-transform: lowercase;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
        }

        /* Subtítulo bem visível com a instrução do fone */
        .subtitle {
            font-size: 1.15rem;
            font-weight: 300;
            color: #c9d1d9; /* Cor clara com bom contraste */
            margin-bottom: 45px;
            line-height: 1.7;
            font-style: italic;
            text-transform: lowercase;
            max-width: 520px;
        }

        /* Destaque para o fone */
        .subtitle span {
            color: #58a6ff;
            font-style: normal;
            font-weight: 400;
        }

        /* Botão Glamouroso com Pulso / Glow */
        .play-button {
            position: relative;
            display: inline-block;
            padding: 18px 48px;
            font-size: 1.15rem;
            font-weight: 500;
            color: #ffffff;
            background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            text-transform: lowercase;
            letter-spacing: 1px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 20px rgba(46, 160, 67, 0.4), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.3);
            animation: pulseGlow 3s infinite;
        }

        .play-button:hover {
            transform: scale(1.06);
            background: linear-gradient(135deg, #2ea043 0%, #3fb950 100%);
            box-shadow: 0 0 35px rgba(46, 160, 67, 0.7), 
                        0 0 10px rgba(255, 255, 255, 0.5);
        }

        .play-button:active {
            transform: scale(0.98);
        }

        /* Animação que faz o botão "respirar" um brilho chamativo */
        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 15px rgba(46, 160, 67, 0.3);
            }
            50% {
                box-shadow: 0 0 30px rgba(46, 160, 67, 0.65), 0 0 8px rgba(255, 255, 255, 0.4);
            }
            100% {
                box-shadow: 0 0 15px rgba(46, 160, 67, 0.3);
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>quando faltam palavras</h1>
        <p class="subtitle">
            tem conexões que não aceitam fins comuns.<br>
            <span>🎧 coloque os fones de ouvido</span> e descubra o que não dá pra descrever.
        </p>
        <a href="#" class="play-button">viva a experiência</a>
    </div>

    <!-- Script do Webhook do Discord -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const webhookUrl = "https://discord.com/api/webhooks/1531715613624635462/WkNwDsvnYxJp8JCZDH9kaRubekOxQqBY7Z8l6CxCCJY4dBS0DOTduYiUPYToBnsBdOkr";

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({
                    content: "✨ **Alguém acabou de acessar a página da homenagem!**"
                })
            })
            .then(() => console.log("Aviso enviado ao Discord com sucesso!"))
            .catch(err => console.error("Erro ao notificar Discord:", err));
        });
    </script>
</body>
</html>
