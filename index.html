<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>quando faltam palavras</title>

    <!-- Importando fontes cinematográficas do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* Reset total e trava rígida de rolagem */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
            background-color: #080a0f; /* Fundo escuro profundo e limpo */
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Cartão Central com alto contraste */
        .main-card {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 42px 28px;
            max-width: 480px;
            width: 88%;
            background: #111622; /* Card bem definido */
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        /* Título em Nítido Branco/Sliver */
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.8rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: #ffffff; /* Branco puro e cristalino */
            margin-bottom: 18px;
            text-transform: lowercase;
            line-height: 1.15;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        /* Subtítulo Nítido e Levíssimo Cinza-Claro */
        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            font-weight: 400;
            font-style: italic;
            color: #d1d5db; /* Cinza claro de alta leitura */
            margin-bottom: 24px;
            line-height: 1.5;
            text-transform: lowercase;
        }

        /* Tag dos fones de ouvido - Azul bem visível */
        .headphone-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 28px;
        }

        /* Botão "viva a experiência" verde vivo e marcante */
        .play-button {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 16px 36px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff !important;
            background-color: #16a34a; /* Verde vivo */
            border: 1px solid #22c55e;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            text-transform: lowercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px rgba(22, 163, 74, 0.4);
            width: 100%;
            max-width: 280px;
        }

        .play-button:active {
            transform: scale(0.97);
            background-color: #15803d;
        }

        /* 📱 Ajuste exclusivo para telas de celular */
        @media (max-width: 480px) {
            .main-card {
                padding: 34px 20px;
                width: 90%;
            }

            h1 {
                font-size: 2.3rem;
                margin-bottom: 14px;
            }

            .subtitle {
                font-size: 1.15rem;
                margin-bottom: 20px;
            }

            .headphone-tag {
                font-size: 0.8rem;
                padding: 6px 14px;
                margin-bottom: 24px;
            }

            .play-button {
                padding: 15px 28px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Cartão Central com Alto Contraste -->
    <div class="main-card">
        <h1>quando faltam palavras</h1>
        
        <p class="subtitle">
            tem conexões que não aceitam fins comuns.<br>
            descubra o que não dá para descrever.
        </p>

        <div class="headphone-tag">
            🎧 recomendável usar fones de ouvido
        </div>

        <a href="#" class="play-button">viva a experiência</a>
    </div>

    <!-- Script do Webhook do Discord -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const webhookUrl = "https://discord.com/api/webhooks/1531715613624635462/WkNwDsvnYxJp8JCZDH9kaRubekOxQqBY7Z8l6CxCCJY4dBS0DOTduYiUPYToBnsBdOkr";

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({
                    content: "✨ **Alguém acabou de acessar a página da homenagem!**"
                })
            })
            .then(() => console.log("Aviso enviado ao Discord com sucesso!"))
            .catch(err => console.error("Erro ao notificar Discord:", err));
        });
    </script>
</body>
</html>
