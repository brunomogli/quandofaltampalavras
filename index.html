<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quando faltam palavras</title>
    <style>
        /* Reset de tela e travamento de rolagem */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden; /* Garante que NUNCA terá barra de rolagem */
            background-color: #0b0d12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container Principal */
        .card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px 20px;
            max-width: 500px;
            width: 90%;
        }

        /* Título do Jogo em destaque minimalista */
        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #f0f6fc;
            margin-bottom: 15px;
            text-transform: lowercase;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }

        /* Frase instigante */
        .subtitle {
            font-size: 1rem;
            font-weight: 300;
            color: #8b949e;
            margin-bottom: 35px;
            line-height: 1.6;
            font-style: italic;
            text-transform: lowercase;
        }

        /* Botão "viva a experiência" */
        .play-button {
            display: inline-block;
            padding: 14px 38px;
            font-size: 1.05rem;
            font-weight: 400;
            color: #ffffff;
            background-color: #238636;
            border: none;
            border-radius: 30px; /* Bordas arredondadas para ar de suavidade */
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(35, 134, 54, 0.3);
            text-transform: lowercase;
            letter-spacing: 0.5px;
        }

        .play-button:hover {
            background-color: #2ea043;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(46, 160, 67, 0.45);
        }

        .play-button:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>quando faltam palavras</h1>
        <p class="subtitle">tem conexões que não aceitam fins comuns.<br>coloque os fones de ouvido e descubra o que não dá pra descrever.</p>
        <a href="#" class="play-button">viva a experiência</a>
    </div>

    <!-- Script do Webhook do Discord -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const webhookUrl = "https://discord.com/api/webhooks/1531715613624635462/WkNwDsvnYxJp8JCZDH9kaRubekOxQqBY7Z8l6CxCCJY4dBS0DOTduYiUPYToBnsBdOkr";

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({
                    content: "✨ **Alguém acabou de acessar a página da homenagem!**"
                })
            })
            .then(() => console.log("Aviso enviado ao Discord com sucesso!"))
            .catch(err => console.error("Erro ao notificar Discord:", err));
        });
    </script>
</body>
</html>
